<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODB++ Viewer — DeltaProto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ===== DeltaProto Design Tokens ===== */
        :root {
            --bg: #f2f2f2;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-viewer: #e8e8e8;
            --fg: #262626;
            --fg-muted: #595959;
            --fg-faint: #999;
            --border: #bfbfbf;
            --border-subtle: #d9d9d9;
            --primary: #2e84cc;
            --primary-hover: #2574b8;
            --primary-fg: #ffffff;
            --accent-red: #d82a30;
            --ring: #2e84cc;
            --item-bg: #f5f5f5;
            --item-hover: #ebebeb;
            --tab-active-bg: #ffffff;
            --tooltip-bg: #ffffff;
            --tooltip-border: #d9d9d9;
            --tooltip-shadow: rgba(0,0,0,0.1);
            --drag-tint: rgba(46,132,204,0.08);
            --loading-bg: rgba(255,255,255,0.95);
            --grid-line: rgba(0,0,0,0.04);
            --checkbox-accent: #2e84cc;
            --progress-from: #2e84cc;
            --progress-to: #5ba3dd;
            --spinner-track: #d9d9d9;
        }
        .dark {
            --bg: #1a1a1a;
            --bg-card: #1f1f1f;
            --bg-input: #2a2a2a;
            --bg-viewer: #141414;
            --fg: #d9d9d9;
            --fg-muted: #8c8c8c;
            --fg-faint: #666;
            --border: #404040;
            --border-subtle: #333;
            --primary: #2e84cc;
            --primary-hover: #3a93dd;
            --primary-fg: #ffffff;
            --accent-red: #d82a30;
            --ring: #2e84cc;
            --item-bg: #262626;
            --item-hover: #333;
            --tab-active-bg: #141414;
            --tooltip-bg: #1f1f1f;
            --tooltip-border: #404040;
            --tooltip-shadow: rgba(0,0,0,0.5);
            --drag-tint: rgba(46,132,204,0.1);
            --loading-bg: rgba(31,31,31,0.95);
            --grid-line: rgba(255,255,255,0.03);
            --checkbox-accent: #2e84cc;
            --progress-from: #2e84cc;
            --progress-to: #5ba3dd;
            --spinner-track: #404040;
        }

        /* ===== Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--fg); height: 100vh;
            display: flex; flex-direction: column; transition: background 0.2s, color 0.2s;
        }

        /* ===== Scrollbar ===== */
        * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

        /* ===== Header ===== */
        header {
            background: var(--bg-card); padding: 10px 20px; display: flex;
            align-items: center; gap: 16px; border-bottom: 1px solid var(--border);
            height: 56px;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .header-brand svg { height: 32px; width: 32px; flex-shrink: 0; }
        header h1 { font-size: 1.125rem; font-weight: 600; color: var(--fg); }
        header h1 span { color: var(--fg-muted); font-weight: 400; }
        .upload-btn {
            background: var(--primary); color: var(--primary-fg); border: none; padding: 7px 16px;
            border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 500;
            transition: background 0.15s; font-family: inherit;
        }
        .upload-btn:hover { background: var(--primary-hover); }
        #file-input { display: none; }
        .example-btn {
            background: none; color: var(--primary); border: none; padding: 7px 4px;
            cursor: pointer; font-size: 0.875rem; font-weight: 500; font-family: inherit;
            text-decoration: underline; text-underline-offset: 2px;
            transition: color 0.15s;
        }
        .example-btn:hover { color: var(--primary-hover); }
        .header-checkbox {
            display: flex; align-items: center; gap: 6px; font-size: 0.8125rem;
            cursor: pointer; color: var(--fg-muted);
        }
        .header-checkbox input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--checkbox-accent); }
        .theme-toggle {
            background: none; border: 1px solid var(--border); width: 36px; height: 36px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: var(--fg-muted); transition: background 0.15s, color 0.15s;
            flex-shrink: 0; text-decoration: none;
        }
        .theme-toggle:hover { background: var(--item-hover); color: var(--fg); }
        /* The running library version, filled in by the server; hidden if it can't tell. */
        .app-version {
            margin-left: auto; font-size: 0.75rem; color: var(--fg-faint);
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        /* Zoom controls float over the artwork, in the viewer's top-right corner. */
        .zoom-controls {
            position: absolute; top: 10px; right: 12px; z-index: 2;
            display: flex; gap: 4px; align-items: center;
        }
        .zoom-btn {
            background: var(--bg-input); color: var(--fg); border: 1px solid var(--border);
            width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; font-family: inherit;
        }
        .zoom-btn:hover { background: var(--item-hover); }
        .zoom-level {
            background: var(--bg-input); border: 1px solid var(--border); padding: 6px 8px;
            border-radius: 8px; font-size: 0.75rem; min-width: 52px; text-align: center;
            color: var(--fg-muted); font-variant-numeric: tabular-nums;
        }

        /* ===== Layout ===== */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 280px; flex-shrink: 0; background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
        }
        .sidebar-resizer {
            width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent;
            transition: background 0.15s; margin-left: -3px; z-index: 10; position: relative;
        }
        .sidebar-resizer:hover, .sidebar-resizer.dragging { background: var(--primary); }
        body.resizing-sidebar { cursor: col-resize; user-select: none; }
        body.resizing-sidebar * { cursor: col-resize !important; }
        .sidebar h2 {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--fg-muted); margin-bottom: 4px; font-weight: 600;
        }

        /* ===== View Tabs ===== */
        .view-tabs {
            display: flex; gap: 2px; padding: 8px 16px; background: var(--bg-card);
            border-bottom: 1px solid var(--border); flex-wrap: wrap; row-gap: 4px;
        }
        .view-tab {
            background: transparent; color: var(--fg-muted); border: none; padding: 8px 12px;
            border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.8125rem;
            transition: background 0.15s, color 0.15s; font-family: inherit; font-weight: 500;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            white-space: nowrap;
        }
        .view-tab:hover { background: var(--item-hover); color: var(--fg); }
        .view-tab.active { background: var(--tab-active-bg); color: var(--primary); font-weight: 600; }
        .view-tab:disabled { cursor: not-allowed; opacity: 0.4; }
        .view-tab svg { width: 14px; height: 14px; flex-shrink: 0; }
        /* Soldermask color swatches — pick the realistic view's mask color. */
        .soldermask-swatches {
            display: inline-flex; align-items: center; gap: 5px;
            margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--border);
        }
        .sm-swatch {
            width: 16px; height: 16px; padding: 0; border-radius: 4px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.25); box-sizing: border-box;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .sm-swatch:hover { transform: scale(1.15); }
        .sm-swatch.active { box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--ring); }
        .btn-spinner {
            width: 14px; height: 14px; border: 2px solid var(--spinner-track);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; display: inline-block; flex-shrink: 0;
        }

        /* ===== Layer Controls ===== */
        .side-btn {
            background: var(--bg-input); color: var(--fg-muted); border: 1px solid var(--border);
            padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.6875rem;
            transition: background 0.15s, color 0.15s; font-family: inherit; font-weight: 500;
        }
        .side-btn:hover { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
        .layer-list { display: flex; flex-direction: column; gap: 3px; }
        .layer-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: var(--item-bg); border-radius: 8px; cursor: pointer;
            transition: background 0.15s; border: 1px solid transparent;
        }
        .layer-item:hover { background: var(--item-hover); border-color: var(--border-subtle); }
        .layer-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--checkbox-accent); }
        .layer-item .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }
        .layer-item .name {
            flex: 1; font-size: 0.8125rem; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .layer-item .layer-type-badge {
            font-size: 0.6875rem; padding: 2px 6px; border-radius: 4px;
            background: var(--bg-input); color: var(--fg-muted); border: 1px solid var(--border-subtle);
            white-space: nowrap;
        }
        .layer-item .name[title] { position: relative; }
        .layer-item .name:hover::after {
            content: attr(title); position: absolute; left: 0; top: 100%;
            background: var(--tooltip-bg); color: var(--fg); padding: 4px 8px; border-radius: 6px;
            font-size: 0.75rem; white-space: nowrap; z-index: 100;
            border: 1px solid var(--tooltip-border); box-shadow: 0 4px 12px var(--tooltip-shadow);
            pointer-events: none;
        }

        /* ===== Viewer ===== */
        .viewer-container {
            flex: 1; position: relative; overflow: hidden; background: var(--bg-viewer);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 37.795px 37.795px;   /* 10 mm; updateTransform() rescales it */
        }
        /* Table views (stackup, BOM) cover the artwork, so the pan/zoom furniture goes with it. */
        .viewer-container.data-view .zoom-controls,
        .viewer-container.data-view .grid-hint { display: none; }
        /* What one grid square means — small, out of the way, never in the pointer's path. */
        .grid-hint {
            position: absolute; left: 12px; bottom: 10px; z-index: 1;
            font-size: 0.6875rem; color: var(--fg-faint); pointer-events: none;
            font-variant-numeric: tabular-nums;
        }
        /* Components drawn over the realistic board: translucent so the pads show through,
           and lit up on hover together with the BOM hover card. */
        .comp-overlay [data-outline] { fill-opacity: 0.45; transition: fill-opacity 0.1s; }
        .comp-overlay [data-refdes]:hover [data-outline],
        .comp-overlay [data-refdes].comp-hover [data-outline] { fill-opacity: 0.85; }
        .comp-overlay [data-refdes] { cursor: pointer; }
        .comp-overlay text { pointer-events: none; }
        .comp-hovercard {
            position: absolute; z-index: 5; pointer-events: none; max-width: 340px;
            background: var(--tooltip-bg); color: var(--fg); border: 1px solid var(--tooltip-border);
            border-radius: 8px; box-shadow: 0 8px 24px var(--tooltip-shadow); padding: 10px 12px;
            font-size: 0.75rem; line-height: 1.4;
        }
        .comp-hovercard.hidden { display: none; }
        .comp-hovercard h4 {
            font-size: 0.875rem; font-weight: 600; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline;
        }
        .comp-hovercard h4 .side { font-size: 0.6875rem; font-weight: 500; color: var(--fg-muted); }
        .comp-hovercard dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0; }
        .comp-hovercard dt { color: var(--fg-muted); white-space: nowrap; }
        .comp-hovercard dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
        .comp-hovercard .desc { margin-top: 6px; color: var(--fg-muted); font-style: italic; }
        #svg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
        #svg-container:active { cursor: grabbing; }
        #svg-content { transform-origin: 0 0; }
        #data-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: auto; background: var(--bg);
        }
        #data-panel.hidden { display: none; }
        .drop-zone {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: var(--fg-faint);
        }
        .drop-zone svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.4; }
        .drop-zone p { font-size: 1.1rem; margin-bottom: 8px; }
        .drop-zone small { font-size: 0.85rem; color: var(--fg-faint); }
        .drag-over { background: var(--drag-tint) !important; }
        .loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: var(--loading-bg); padding: 32px 48px;
            border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border: 1px solid var(--border);
        }
        .spinner {
            width: 48px; height: 48px; border: 3px solid var(--spinner-track);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; font-size: 1rem; color: var(--fg); }
        .loading-status { margin-top: 8px; font-size: 0.8125rem; color: var(--fg-muted); min-height: 20px; }
        .progress-bar { width: 200px; height: 4px; background: var(--spinner-track); border-radius: 2px; margin: 16px auto 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--progress-from), var(--progress-to)); border-radius: 2px; transition: width 0.3s ease; width: 0%; }
        .progress-bar-indeterminate .progress-bar-fill { width: 30%; animation: indeterminate 1.5s ease-in-out infinite; }
        @keyframes indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
        .hidden { display: none !important; }
        .no-layers { color: var(--fg-faint); font-size: 0.8125rem; padding: 20px; text-align: center; }
        .file-info {
            background: var(--item-bg); padding: 10px 12px; border-radius: 8px;
            font-size: 0.8125rem; color: var(--fg-muted); border: 1px solid var(--border-subtle);
        }

        /* ===== Recent Projects ===== */
        .recent-projects { display: flex; flex-direction: column; gap: 4px; }
        .recent-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: var(--item-bg); border-radius: 8px; cursor: pointer;
            transition: background 0.15s; border: 1px solid transparent;
        }
        .recent-item:hover { background: var(--item-hover); border-color: var(--border-subtle); }
        .recent-item .recent-icon {
            width: 28px; height: 28px; border-radius: 6px; background: var(--primary);
            color: var(--primary-fg); display: flex; align-items: center; justify-content: center;
            font-size: 0.6875rem; font-weight: 600; flex-shrink: 0;
        }
        .recent-item .recent-info { flex: 1; min-width: 0; }
        .recent-item .recent-name {
            font-size: 0.8125rem; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; color: var(--fg);
        }
        .recent-item .recent-date { font-size: 0.6875rem; color: var(--fg-faint); }
        .recent-item .recent-delete {
            background: none; border: none; color: var(--fg-faint); cursor: pointer;
            padding: 2px 4px; border-radius: 4px; font-size: 0.875rem; line-height: 1;
            opacity: 0; transition: opacity 0.15s, color 0.15s;
        }
        .recent-item:hover .recent-delete { opacity: 1; }
        .recent-item .recent-delete:hover { color: var(--accent-red); }

        /* ===== BOM table ===== */
        /* The BOM fills the data panel as a column: a fixed toolbar over a table that scrolls
           on its own, so the sticky column header can sit at top:0 of that scroller instead of
           guessing the toolbar's height (which wraps at narrow widths and overlapped row 1). */
        .bom-view { display: flex; flex-direction: column; height: 100%; }
        .bom-toolbar {
            flex: none; z-index: 2;
            display: flex; gap: 12px; align-items: center;
            padding: 10px 16px; background: var(--bg);
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        .bom-summary { color: var(--fg-faint); font-size: 0.85rem; }
        .bom-search {
            flex: 1; min-width: 200px; padding: 6px 10px;
            background: var(--item-hover); color: var(--fg);
            border: 1px solid var(--border); border-radius: 4px;
            font: inherit; font-size: 0.875rem;
        }
        .bom-search:focus { outline: 1px solid var(--primary); border-color: var(--primary); }
        .bom-export {
            padding: 6px 12px; background: transparent; color: var(--fg);
            border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
            font-size: 0.825rem;
        }
        .bom-export:hover { background: var(--item-hover); border-color: var(--primary); color: var(--primary); }
        .bom-table-wrap { flex: 1; min-height: 0; overflow: auto; padding: 0 0 16px; }
        .bom-table {
            width: 100%; border-collapse: collapse; font-size: 0.825rem;
            font-variant-numeric: tabular-nums;
        }
        .bom-table th, .bom-table td {
            padding: 6px 10px; text-align: left;
            border-bottom: 1px solid var(--border); vertical-align: top;
        }
        .bom-table thead th {
            position: sticky; top: 0; z-index: 1;
            background: var(--bg); cursor: pointer; user-select: none;
            box-shadow: inset 0 -1px 0 var(--border);
            font-weight: 600; color: var(--fg);
        }
        .bom-table thead th:hover { color: var(--primary); }
        .bom-table tbody tr:hover { background: var(--item-hover); }
        .bom-table .num { text-align: right; font-feature-settings: "tnum"; white-space: nowrap; color: var(--fg-faint); }
        .bom-table .description {
            max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--fg-faint);
        }
        .bom-table tr.orphan td { opacity: 0.7; font-style: italic; }
        .refdes-cell { line-height: 1.6; }
        .refdes-pill {
            display: inline-block; padding: 1px 8px; margin: 1px 3px 1px 0;
            border-radius: 10px; font-size: 0.75rem; font-weight: 500;
            background: var(--item-hover); color: var(--fg);
            border: 1px solid var(--border); cursor: help;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .refdes-pill:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
        .refdes-pill.side-top    { background: rgba(106,174,214,0.18); border-color: #6aaed6; color: #6aaed6; }
        .refdes-pill.side-bottom { background: rgba(232,150,84,0.18);  border-color: #e89654; color: #e89654; }

        /* ===== Stack-up table (DeltaProto PCB specification sheet look) ===== */
        .dp-spec-sheet {
            --dp-blue: #0070c0; --dp-radius-sm: 4px;
            max-width: 1100px; margin: 0 auto; padding: 20px;
            color: var(--fg); font-size: 0.8125rem; line-height: 1.45;
        }
        .dp-table {
            width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed;
            margin-bottom: 0.75rem;
        }
        .dp-table th, .dp-table td { box-sizing: border-box; overflow-wrap: anywhere; }
        .dp-table thead th {
            background: var(--dp-blue); color: #fff; font-weight: 600; text-align: left;
            padding: 5px 11px;
        }
        .dp-table-title th {
            font-size: 0.9375rem; font-weight: 700; padding: 7px 11px;
            border-bottom: 6px solid var(--bg);
        }
        .dp-table-title th:first-child { border-top-left-radius: var(--dp-radius-sm); border-bottom-left-radius: var(--dp-radius-sm); }
        .dp-table-title th:last-child  { border-top-right-radius: var(--dp-radius-sm); border-bottom-right-radius: var(--dp-radius-sm); }
        .dp-table-title + tr th {
            font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.85;
        }
        .dp-table-title + tr th:first-child { border-top-left-radius: var(--dp-radius-sm); }
        .dp-table-title + tr th:last-child  { border-top-right-radius: var(--dp-radius-sm); }
        .dp-table tbody td { padding: 3px 11px; vertical-align: middle; border-bottom: none; }
        .dp-col-chip { width: 30%; }
        .dp-col-file { width: 27%; }
        .dp-col-material { width: 23%; }
        .dp-chip {
            display: block; box-sizing: border-box; padding: 3px 8px;
            border-radius: var(--dp-radius-sm); background: var(--dp-swatch, transparent);
            color: #fff; font-weight: 600; line-height: 1.25;
            box-shadow: inset 0 0 0 1px rgba(128,128,128,0.25);
        }
        .dp-chip--light { color: #1b1b1b; }
        .dp-chip--plain { background: transparent; color: var(--fg); padding-left: 0; box-shadow: none; }
        .dp-chip--thick { padding-top: 6px; padding-bottom: 6px; }
        .dp-stack-meta { color: var(--fg-muted); }
        .dp-stack-file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; }
        .dp-stack-est { font-style: italic; color: var(--fg-faint); }
        .dp-stack-total {
            display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 16px;
            margin: 0 0 6px; padding: 5px 11px 0; border-top: 1px solid var(--border-subtle);
            color: var(--fg-muted);
        }

    </style>
</head>
