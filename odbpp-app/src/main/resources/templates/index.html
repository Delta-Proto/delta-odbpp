    <script>
        // ===== Configuration =====
        const API_BASE = window.ODBPP_API_BASE || '';
        const DB_NAME = 'odbpp-viewer';
        const DB_VERSION = 1;
        const STORE_NAME = 'projects';
        const MAX_RECENT = 5;
        // The model is mm-normalised at parse time, so SVG viewBoxes are always in mm.
        /** CSS pixels per millimetre at 100% — the SVG is sized in mm, and CSS puts 96 dpi on it. */
        const PX_PER_MM = 96 / 25.4;
        /** Backdrop grid pitch in millimetres, as announced by the hint in the viewer's corner. */
        const GRID_MM = 10;

        // Soldermask color options for the realistic view. `mask`/`silk` are the
        // colors actually rendered (mirrors SoldermaskColor.java); the tab swatch
        // shows the fab's brighter advertised color. GREEN keeps our darker, more
        // realistic mask shade rather than the bright swatch green.
        const SOLDERMASK_COLORS = {
            green:  { mask: '#004200', silk: '#ffffff' },
            purple: { mask: '#ac13a6', silk: '#ffffff' },
            red:    { mask: '#bf0100', silk: '#ffffff' },
            yellow: { mask: '#ffaa16', silk: '#ffffff' },
            blue:   { mask: '#002d8c', silk: '#ffffff' },
            white:  { mask: '#f7f9fe', silk: '#000000' },
            black:  { mask: '#0f1010', silk: '#ffffff' },
        };
        let selectedSoldermask = 'green';

        // ===== State =====
        let layers = [];
        let currentFile = null;
        let combinedSvg = '';
        let realisticTopSvg = null;
        let realisticBottomSvg = null;
        let componentsTopSvg = null;
        let componentsBottomSvg = null;
        let stackupData = null;
        let stackupTotalMm = 0;
        let billData = null;
        let bomSortKey = 'item';
        let bomSortDir = 1;
        let bomFilter = '';
        let currentView = 'layers';
        let scale = 1, panX = 0, panY = 0, isPanning = false, startX, startY;
        let db = null;

        // Layer type colors (matching ODB++ matrix types)
        const LAYER_TYPE_COLORS = {
            'SIGNAL': '#CC0000', 'POWER_GROUND': '#0000CC', 'MIXED': '#6600CC',
            'SOLDER_MASK': '#00CC00', 'SILK_SCREEN': '#FFFF00', 'SOLDER_PASTE': '#FF6600',
            'DRILL': '#FF00FF', 'ROUT': '#00FFFF', 'DOCUMENT': '#888888',
            'COMPONENT': '#FF8800', 'DIELECTRIC': '#996633', 'PROFILE': '#FF5522'
        };

        const LAYER_TYPE_LABELS = {
            'SIGNAL': 'Signal', 'POWER_GROUND': 'Power', 'MIXED': 'Mixed',
            'SOLDER_MASK': 'Mask', 'SILK_SCREEN': 'Silk', 'SOLDER_PASTE': 'Paste',
            'DRILL': 'Drill', 'ROUT': 'Rout', 'DOCUMENT': 'Doc',
            'COMPONENT': 'Comp', 'DIELECTRIC': 'Diel', 'PROFILE': 'Profile'
        };

        const TOP_TYPES_CONTEXTS = ['TOP'];
        const BOTTOM_TYPES_CONTEXTS = ['BOTTOM'];

        // DOM refs
        const fileInput = document.getElementById('file-input');
        const layerList = document.getElementById('layer-list');
        const svgContainer = document.getElementById('svg-container');
        const svgContent = document.getElementById('svg-content');
        const dataPanel = document.getElementById('data-panel');
        const viewerContainer = document.getElementById('viewer-container');
        const dropZone = document.getElementById('drop-zone');
        const loading = document.getElementById('loading');
        const zoomLevel = document.getElementById('zoom-level');

        // ===== IndexedDB =====
        function openDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function initDb() {
            try { db = await openDb(); } catch (e) { console.warn('IndexedDB unavailable:', e); }
        }

        function tx_complete(tx) {
            return new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        }

        async function storeProjectSafe(name, blob) {
            if (!db) return;
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id: name, name, blob, date: Date.now(), size: blob.size });
                await tx_complete(tx);
                await pruneRecent();
            } catch (e) { console.warn('Failed to store project:', e); }
        }

        async function getRecentProjects() {
            if (!db) return [];
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => {
                    const all = req.result || [];
                    all.sort((a, b) => b.date - a.date);
                    resolve(all.slice(0, MAX_RECENT));
                };
                req.onerror = () => resolve([]);
            });
        }

        async function getProjectBlob(id) {
            if (!db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                req.onerror = () => resolve(null);
            });
        }

        async function deleteProject(id) {
            if (!db) return;
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                await tx_complete(tx);
                renderRecentProjects();
            } catch (e) { console.warn('Failed to delete project:', e); }
        }

        async function pruneRecent() {
            if (!db) return;
            const all = await getRecentProjects();
            // getRecentProjects returns sorted, capped to MAX_RECENT
            // Get ALL to find ones beyond the limit
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = async () => {
                const records = req.result || [];
                if (records.length <= MAX_RECENT) return;
                records.sort((a, b) => b.date - a.date);
                const toDelete = records.slice(MAX_RECENT);
                const dtx = db.transaction(STORE_NAME, 'readwrite');
                const dstore = dtx.objectStore(STORE_NAME);
                for (const r of toDelete) dstore.delete(r.id);
            };
        }

        async function renderRecentProjects() {
            const list = document.getElementById('recent-list');
            const projects = await getRecentProjects();
            if (projects.length === 0) {
                list.innerHTML = '<div class="no-layers">No recent projects</div>';
                return;
            }
            list.innerHTML = projects.map(p => {
                const date = new Date(p.date);
                const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
                    + ' ' + date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                const sizeStr = p.size > 1048576
                    ? (p.size / 1048576).toFixed(1) + ' MB'
                    : (p.size / 1024).toFixed(0) + ' KB';
                const ext = p.name.split('.').pop().toUpperCase();
                return `<div class="recent-item" onclick="loadFromRecent('${escapeAttr(p.id)}')" title="${escapeAttr(p.name)}">
                    <div class="recent-icon">${ext}</div>
                    <div class="recent-info">
                        <div class="recent-name">${escapeHtml(p.name)}</div>
                        <div class="recent-date">${dateStr} &middot; ${sizeStr}</div>
                    </div>
                    <button class="recent-delete" onclick="event.stopPropagation(); deleteProject('${escapeAttr(p.id)}')" title="Remove from history">&times;</button>
                </div>`;
            }).join('');
        }

        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escapeAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        async function loadFromRecent(id) {
            const blob = await getProjectBlob(id);
            if (!blob) { alert('File no longer available in browser storage.'); return; }
            const file = new File([blob], id, { type: blob.type || 'application/octet-stream' });
            loadFile(file);
        }

        // ===== File input & drag-drop =====
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) loadFile(e.target.files[0]);
        });
        viewerContainer.addEventListener('dragover', (e) => {
            e.preventDefault(); viewerContainer.classList.add('drag-over');
        });
        viewerContainer.addEventListener('dragleave', () => viewerContainer.classList.remove('drag-over'));
        viewerContainer.addEventListener('drop', (e) => {
            e.preventDefault(); viewerContainer.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
        });

        // ===== Main load flow =====
        async function loadFile(file) {
            const loadingStatus = document.getElementById('loading-status');
            const progressBar = document.querySelector('.progress-bar');
            dropZone.classList.add('hidden');
            loading.classList.remove('hidden');
            progressBar.classList.add('progress-bar-indeterminate');
            currentFile = file;

            try {
                loadingStatus.textContent = 'Uploading ' + file.name + '...';

                const formData = new FormData();
                formData.append('file', file);

                const resp = await fetch(API_BASE + '/api/odbpp/render', {
                    method: 'POST',
                    body: formData
                });

                if (!resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    throw new Error(data.error || 'Server error: ' + resp.status);
                }

                loadingStatus.textContent = 'Rendering...';
                const data = await resp.json();
                if (data.error) throw new Error(data.error);

                // Store results
                combinedSvg = data.svg;
                realisticTopSvg = data.realisticTopSvg;
                realisticBottomSvg = data.realisticBottomSvg;
                componentsTopSvg = data.componentsTopSvg;
                componentsBottomSvg = data.componentsBottomSvg;
                stackupData = Array.isArray(data.stackup) ? data.stackup : [];
                stackupTotalMm = Number(data.stackupTotalMm) || 0;
                billData = Array.isArray(data.bill) ? data.bill : [];

                // Build layer state from metadata
                layers = (data.layers || []).map((meta, index) => ({
                    name: meta.name,
                    id: meta.id,
                    type: meta.type || 'DOCUMENT',
                    context: meta.context || '',
                    color: LAYER_TYPE_COLORS[meta.type] || '#888888',
                    visible: true,
                    index
                }));

                // Show file info
                showFileInfo(data.filename, data.stepCount);

                // Show view tabs and configure realistic tab availability
                document.getElementById('view-tabs').style.display = 'flex';
                const topTab = document.querySelector('[data-view="top"]');
                const botTab = document.querySelector('[data-view="bottom"]');
                topTab.disabled = !realisticTopSvg;
                topTab.style.opacity = realisticTopSvg ? 1 : 0.4;
                botTab.disabled = !realisticBottomSvg;
                botTab.style.opacity = realisticBottomSvg ? 1 : 0.4;
                const compTopTab = document.querySelector('[data-view="comp-top"]');
                const compBotTab = document.querySelector('[data-view="comp-bottom"]');
                if (compTopTab) {
                    compTopTab.disabled = !componentsTopSvg;
                    compTopTab.style.opacity = componentsTopSvg ? 1 : 0.4;
                }
                if (compBotTab) {
                    compBotTab.disabled = !componentsBottomSvg;
                    compBotTab.style.opacity = componentsBottomSvg ? 1 : 0.4;
                }
                const stackupTab = document.querySelector('[data-view="stackup"]');
                if (stackupTab) {
                    const has = stackupData && stackupData.length > 0;
                    stackupTab.disabled = !has;
                    stackupTab.style.opacity = has ? 1 : 0.4;
                }
                const bomTab = document.querySelector('[data-view="bom"]');
                if (bomTab) {
                    const has = billData && billData.length > 0;
                    bomTab.disabled = !has;
                    bomTab.style.opacity = has ? 1 : 0.4;
                }
                const topDl = document.getElementById('png-top-btn');
                const botDl = document.getElementById('png-bot-btn');
                if (topDl) topDl.disabled = !realisticTopSvg;
                if (botDl) botDl.disabled = !realisticBottomSvg;
                buildPlacementIndex();

                // Render
                currentView = 'layers';
                document.querySelectorAll('.view-tab').forEach(t =>
                    t.classList.toggle('active', t.dataset.view === 'layers'));
                renderSvg();
                renderLayerList();
                fitToView();

                // Store in IndexedDB for recent history
                await storeProjectSafe(file.name, file.slice());
                renderRecentProjects();

            } catch (error) {
                alert('Error: ' + error.message);
                dropZone.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                progressBar.classList.remove('progress-bar-indeterminate');
            }
        }

        // ===== Load bundled example =====
        async function loadExampleArchive() {
            try {
                const resp = await fetch(API_BASE + '/api/odbpp/example.zip');
                if (!resp.ok) throw new Error('Example archive not available (' + resp.status + ')');
                const blob = await resp.blob();
                const file = new File([blob], 'odbpp-sample.zip', { type: 'application/zip' });
                await loadFile(file);
            } catch (e) {
                alert(e.message);
            }
        }

        // ===== PNG thumbnail download =====
        async function downloadThumbnail(side) {
            if (!currentFile) return;
            const btn = document.getElementById(side === 'top' ? 'png-top-btn' : 'png-bot-btn');
            if (btn && btn.disabled) return;
            // Lock the button's current size so swapping to a spinner doesn't reflow the tab bar.
            const rect = btn ? btn.getBoundingClientRect() : null;
            const originalHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.style.width = rect.width + 'px';
                btn.style.height = rect.height + 'px';
                btn.disabled = true;
                btn.innerHTML = '<span class="btn-spinner" aria-label="Generating"></span>';
            }
            try {
                const form = new FormData();
                form.append('file', currentFile);
                const url = API_BASE + '/api/odbpp/thumbnail?side=' + encodeURIComponent(side)
                          + '&width=1600&soldermask=' + encodeURIComponent(selectedSoldermask);
                const resp = await fetch(url, { method: 'POST', body: form });
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error('Thumbnail failed: ' + text);
                }
                const blob = await resp.blob();
                const base = (currentFile.name || 'pcb').replace(/\.(zip|tgz|tar\.gz)$/i, '');
                const objUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = objUrl;
                a.download = base + '-' + side + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
            } catch (e) {
                alert(e.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                    btn.style.width = '';
                    btn.style.height = '';
                }
            }
        }

        // ===== SVG rendering =====
        // The bottom-side renders arrive mirrored about the vertical axis, the way the board
        // looks once you turn it over like a page — so they are shown as delivered, not
        // re-mirrored into an X-ray view.
        function renderSvg() {
            let svgStr = null, overlayStr = null;
            if (currentView === 'layers') svgStr = combinedSvg;
            else if (currentView === 'top') svgStr = realisticTopSvg;
            else if (currentView === 'bottom') svgStr = realisticBottomSvg;
            else if (currentView === 'comp-top') {
                // Components sit on the realistic board when there is one; the silhouette
                // render stands alone otherwise.
                svgStr = realisticTopSvg || componentsTopSvg;
                overlayStr = realisticTopSvg ? componentsTopSvg : null;
            }
            else if (currentView === 'comp-bottom') {
                svgStr = realisticBottomSvg || componentsBottomSvg;
                overlayStr = realisticBottomSvg ? componentsBottomSvg : null;
            }
            else if (currentView === 'stackup') { viewerContainer.classList.add('data-view'); renderStackup(); return; }
            else if (currentView === 'bom') { viewerContainer.classList.add('data-view'); renderBom(); return; }

            // SVG views live in the pan/zoom container
            viewerContainer.classList.remove('data-view');
            svgContainer.classList.remove('hidden');
            dataPanel.classList.add('hidden');
            hideHoverCard();

            if (!svgStr) {
                const msg = currentView.startsWith('comp-')
                    ? 'No components on this side.<br><small>The EDA data may be missing or the archive has no placed components.</small>'
                    : 'No realistic view available.<br><small>The board profile or layer types may not be recognized.</small>';
                svgContent.innerHTML = '<div style="color:var(--fg-faint);text-align:center;padding:40px;">' + msg + '</div>';
                return;
            }

            const parser = new DOMParser();
            const doc = parser.parseFromString(svgStr, 'image/svg+xml');
            const svg = doc.querySelector('svg');
            if (svg) {
                const vb = svg.getAttribute('viewBox');
                if (vb) {
                    // Server emits mm-normalised viewBoxes. Render the SVG with explicit
                    // mm widths so fitToView's px/mm math lines up with the page.
                    const parts = vb.split(' ').map(Number);
                    svg.setAttribute('width',  parts[2] + 'mm');
                    svg.setAttribute('height', parts[3] + 'mm');
                }
                svg.style.overflow = 'visible';

                if (overlayStr) overlayComponents(svg, overlayStr);
                applySoldermaskColor(svg);

                svgContent.innerHTML = '';
                svgContent.appendChild(svg);
            }
            updateTransform();
        }

        // ===== Soldermask color =====
        function setSoldermask(name) {
            if (!SOLDERMASK_COLORS[name]) return;
            selectedSoldermask = name;
            document.querySelectorAll('.sm-swatch').forEach(s =>
                s.classList.toggle('active', s.dataset.color === name));
            // Recolor the realistic view in place (no server round-trip).
            const svg = svgContent.querySelector('svg');
            if (svg) applySoldermaskColor(svg);
        }

        // Recolor the soldermask + silkscreen of a realistic SVG to the selected color.
        // The renderer tags the mask rect (.pcb-soldermask) and silkscreen group
        // (.pcb-silkscreen); silkscreen child shapes carry explicit fill/stroke, so we
        // rewrite each non-"none" value to match what the renderer would emit. No-op on
        // the all-layers view, which has neither marker.
        function applySoldermaskColor(svgEl) {
            const c = SOLDERMASK_COLORS[selectedSoldermask];
            if (!svgEl || !c) return;
            svgEl.querySelectorAll('.pcb-soldermask').forEach(el => el.setAttribute('fill', c.mask));
            svgEl.querySelectorAll('.pcb-silkscreen').forEach(g => {
                g.setAttribute('fill', c.silk);
                g.setAttribute('color', c.silk);
                g.querySelectorAll('*').forEach(el => {
                    const f = el.getAttribute('fill');
                    if (f && f !== 'none') el.setAttribute('fill', c.silk);
                    const s = el.getAttribute('stroke');
                    if (s && s !== 'none') el.setAttribute('stroke', c.silk);
                });
            });
        }

        // ===== Components over the realistic board =====
        // The realistic and components renders share viewBox and viewport transform (both are
        // framed on the step profile with the same padding), so the components group can be
        // lifted out of its own SVG and dropped into the realistic one's viewport as-is.
        function overlayComponents(realSvg, componentsSvgStr) {
            const compDoc = new DOMParser().parseFromString(componentsSvgStr, 'image/svg+xml');
            const group = compDoc.querySelector('[data-stack-layer="components"]');
            const viewport = realSvg.querySelector('#viewport');
            if (!group || !viewport) return;
            const imported = realSvg.ownerDocument.importNode(group, true);
            imported.classList.add('comp-overlay');
            viewport.appendChild(imported);
        }

        // refdes → { row, placement } from the BOM payload, for the hover card.
        let placementIndex = new Map();
        function buildPlacementIndex() {
            placementIndex = new Map();
            for (const row of billData || []) {
                for (const p of row.refdesList || []) {
                    if (p.refdes) placementIndex.set(p.refdes, { row, placement: p });
                }
            }
        }

        const hoverCard = document.getElementById('comp-hovercard');
        let hoveredComp = null;

        function hideHoverCard() {
            hoverCard.classList.add('hidden');
            if (hoveredComp) { hoveredComp.classList.remove('comp-hover'); hoveredComp = null; }
        }

        /**
         * The card's HTML for one designator. `inTable` is the BOM view, whose row already shows
         * part number, package, manufacturer, MPN, item, quantity and description — there the
         * card keeps only what the table does not: side, IPN, centroid, rotation, mirror, body.
         */
        function hoverCardHtml(refdes, hit, inTable) {
            const esc = s => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const num = (v, d) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);
            const row = hit ? hit.row : null;
            const p = hit ? hit.placement : null;
            const side = p && p.side ? p.side.charAt(0) + p.side.slice(1).toLowerCase() : '';
            const rows = [];
            const add = (k, v) => { if (v != null && v !== '') rows.push(`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`); };
            if (row && !inTable) {
                add('Part number', row.partNumber);
                add('Package', row.packageName || (p && p.packageName));
                add('Manufacturer', row.manufacturer);
                add('MPN', row.mpn);
                add('IPN', row.ipn);
                add('BOM item', row.item != null ? '#' + row.item : (row.orphan ? 'not in BOM' : null));
                add('Quantity', row.quantity || (row.refdesList ? row.refdesList.length : null));
            } else if (row && inTable) {
                add('IPN', row.ipn);
                // The table shows the row's package; only say so when this placement differs.
                if (p && p.packageName && p.packageName !== row.packageName) add('Package', p.packageName);
            } else if (p && p.packageName) {
                add('Package', p.packageName);
            }
            if (p) {
                add('Centroid', num(p.xMm, 3) + ', ' + num(p.yMm, 3) + ' mm');
                add('Rotation', num(p.rotation, 1) + '°');
                add('Mirror', p.mirror === 'M' ? 'yes' : p.mirror === 'N' ? 'no' : p.mirror);
                if (p.bboxXMinMm != null && p.bboxXMaxMm != null && p.bboxYMinMm != null && p.bboxYMaxMm != null) {
                    add('Body', num(p.bboxXMaxMm - p.bboxXMinMm, 2) + ' × ' + num(p.bboxYMaxMm - p.bboxYMinMm, 2) + ' mm');
                }
            }
            let html = `<h4>${esc(refdes)}${side ? `<span class="side">${esc(side)}</span>` : ''}</h4>`;
            html += rows.length ? `<dl>${rows.join('')}</dl>`
                                : `<div class="desc">${inTable ? 'No placement data for this designator.' : 'No BOM data for this part.'}</div>`;
            if (row && row.description && !inTable) html += `<div class="desc">${esc(row.description)}</div>`;
            return html;
        }

        function positionHoverCard(e) {
            const rect = viewerContainer.getBoundingClientRect();
            const pad = 14;
            let x = e.clientX - rect.left + pad;
            let y = e.clientY - rect.top + pad;
            const cw = hoverCard.offsetWidth, ch = hoverCard.offsetHeight;
            if (x + cw > rect.width - 8) x = e.clientX - rect.left - cw - pad;
            if (y + ch > rect.height - 8) y = e.clientY - rect.top - ch - pad;
            hoverCard.style.left = Math.max(4, x) + 'px';
            hoverCard.style.top = Math.max(4, y) + 'px';
        }

        function compUnderPointer(e) {
            const el = e.target instanceof Element ? e.target : null;
            if (!el) return null;
            const label = el.closest('[data-refdes-label]');
            if (label) {
                const rd = label.getAttribute('data-refdes-label');
                return svgContent.querySelector(`[data-refdes="${CSS.escape(rd)}"]`) || label;
            }
            return el.closest('[data-refdes]');
        }

        svgContent.addEventListener('mousemove', (e) => {
            if (!currentView.startsWith('comp-') || isPanning) { if (hoveredComp) hideHoverCard(); return; }
            const comp = compUnderPointer(e);
            if (!comp) { hideHoverCard(); return; }
            const refdes = comp.getAttribute('data-refdes') || comp.getAttribute('data-refdes-label');
            if (comp !== hoveredComp) {
                if (hoveredComp) hoveredComp.classList.remove('comp-hover');
                hoveredComp = comp;
                comp.classList.add('comp-hover');
                hoverCard.innerHTML = hoverCardHtml(refdes, placementIndex.get(refdes));
                hoverCard.classList.remove('hidden');
            }
            positionHoverCard(e);
        });
        svgContent.addEventListener('mouseleave', hideHoverCard);

        // BOM designator pills use the same card, in its table mode.
        let hoveredPill = null;
        dataPanel.addEventListener('mousemove', (e) => {
            const pill = e.target instanceof Element ? e.target.closest('.refdes-pill') : null;
            if (!pill) { if (hoveredPill) { hoveredPill = null; hideHoverCard(); } return; }
            if (pill !== hoveredPill) {
                hoveredPill = pill;
                const refdes = pill.getAttribute('data-refdes');
                hoverCard.innerHTML = hoverCardHtml(refdes, placementIndex.get(refdes), true);
                hoverCard.classList.remove('hidden');
            }
            positionHoverCard(e);
        });
        dataPanel.addEventListener('mouseleave', () => { hoveredPill = null; hideHoverCard(); });

        function switchView(view) {
            if (view === 'top' && !realisticTopSvg) return;
            if (view === 'bottom' && !realisticBottomSvg) return;
            if (view === 'comp-top' && !componentsTopSvg) return;
            if (view === 'comp-bottom' && !componentsBottomSvg) return;
            if (view === 'stackup' && (!stackupData || stackupData.length === 0)) return;
            if (view === 'bom' && (!billData || billData.length === 0)) return;
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.view === view));
            renderSvg();
            // Pan/zoom fit only applies to SVG views; stackup/bom render to a normal scrollable panel.
            if (view !== 'stackup' && view !== 'bom') fitToView();
        }

        // ===== Stackup table =====
        // Mirrors the "Stack-up, materials, thickness and colours" table of the DeltaProto PCB
        // specification sheet (deltaproto.com /pcbspec and the PDF report): a blue title band, a
        // column band, one coloured chip per physical layer, and a stack-sum line underneath.
        const STACK_SWATCH = {
            copper:     '#f96607',
            dielectric: '#efe6b5',
            soldermask: '#0bad53',
            silkscreen: '#d8d9d3',
            paste:      '#afb0b0',
            finish:     '#fabf1b',
        };

        function formatLengthMm(mm) {
            if (!(mm > 0)) return '—';
            if (mm >= 1) return trimNum(mm, 3) + ' mm';
            return trimNum(mm * 1000, 1) + ' µm';
        }
        function trimNum(v, decimals) {
            return Number(v.toFixed(decimals)).toString();
        }
        function ozLabel(oz) {
            if (oz == null) return '';
            const snapped = Math.abs(oz - Math.round(oz * 2) / 2) < 0.06 ? Math.round(oz * 2) / 2 : oz;
            return trimNum(snapped, 2) + ' oz';
        }
        function titleCase(s) {
            return (s || '').toLowerCase().replace(/(^|[\s_-])(\w)/g, (m, sep, c) => sep + c.toUpperCase());
        }
        // "Top Soldermask" / "Bottom Silkscreen (Overlay)" for the outer sides; a finish that sits
        // inside the stack (a rigid-flex coverlay, say) keeps its own layer name instead of a
        // side it does not have.
        function finishName(e, what) {
            if (e.side === 'TOP') return 'Top ' + what;
            if (e.side === 'BOTTOM') return 'Bottom ' + what;
            return e.name + ' (' + what + ')';
        }

        // Build the table rows from the StackupView entries (already ordered top → bottom).
        function stackRows(entries) {
            const conductorCount = entries.filter(e => e.conductor).length;
            let conductorsSeen = 0;
            let innerIndex = 0;
            return entries.map(e => {
                const row = {
                    name: e.name, file: e.name, swatch: null, light: false, thick: false,
                    material: e.material || '', thickness: formatLengthMm(e.thicknessMm),
                    // A typical stands in only where there is a number to stand in for.
                    estimated: !!e.estimated && e.thicknessMm > 0,
                };
                const type = (e.type || '').toUpperCase();
                if (e.conductor) {
                    conductorsSeen++;
                    if (e.side === 'TOP' || (conductorsSeen === 1 && e.side !== 'BOTTOM')) {
                        row.name = 'Top Conductive Layer';
                    } else if (e.side === 'BOTTOM' || conductorsSeen === conductorCount) {
                        row.name = 'Bottom Conductive Layer';
                    } else {
                        innerIndex++;
                        row.name = 'Internal Conductive Layer ' + innerIndex;
                    }
                    row.swatch = STACK_SWATCH.copper;
                    const kind = type === 'POWER_GROUND' ? 'Plane' : type === 'MIXED' ? 'Mixed' : 'Signal';
                    row.material = [e.material || 'Copper', kind].join(' · ');
                    if (e.copperWeightOz != null) row.thickness += ' (' + ozLabel(e.copperWeightOz) + ')';
                } else if (e.dielectric || type === 'DIELECTRIC') {
                    const above = Math.max(1, conductorsSeen);
                    row.name = 'Dielectric ' + above + '-' + (above + 1);
                    row.swatch = STACK_SWATCH.dielectric;
                    row.light = true;
                    row.thick = e.thicknessMm >= 0.4;
                    const parts = [];
                    if (e.material) parts.push(e.material);
                    if (e.dielectricType) parts.push(titleCase(e.dielectricType));
                    if (e.dielectricConstant != null) parts.push('Dk ' + e.dielectricConstant);
                    row.material = parts.join(' · ');
                } else if (type === 'SOLDER_MASK') {
                    row.name = finishName(e, 'Soldermask');
                    row.swatch = STACK_SWATCH.soldermask;
                    row.light = true;
                } else if (type === 'SILK_SCREEN') {
                    row.name = finishName(e, 'Silkscreen (Overlay)');
                    row.swatch = STACK_SWATCH.silkscreen;
                    row.light = true;
                } else if (type === 'SOLDER_PASTE') {
                    row.name = finishName(e, 'Paste Layer (Stencil)');
                    row.swatch = STACK_SWATCH.paste;
                    row.light = true;
                    row.material = e.material || 'Stencil';
                } else if (type === 'CONDUCTIVE_PASTE') {
                    row.name = finishName(e, 'Conductive Paste');
                    row.swatch = STACK_SWATCH.finish;
                    row.light = true;
                }
                return row;
            });
        }

        function renderStackup() {
            svgContainer.classList.add('hidden');
            dataPanel.classList.remove('hidden');
            if (!stackupData || stackupData.length === 0) {
                dataPanel.innerHTML = '<div style="color:var(--fg-faint);padding:40px;text-align:center;">No stackup data available.</div>';
                return;
            }

            const esc = s => String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const rows = stackRows(stackupData);

            const copperMm = stackupData.filter(e => e.conductor).reduce((s, e) => s + e.thicknessMm, 0);
            const dielectricMm = stackupData.filter(e => e.dielectric).reduce((s, e) => s + e.thicknessMm, 0);
            const anyEstimated = stackupData.some(e => e.estimated);

            let html = '<div class="dp-spec-sheet">';
            html += '<table class="dp-table dp-table--bare">';
            html += '<colgroup><col class="dp-col-chip"><col class="dp-col-file"><col class="dp-col-material"><col></colgroup>';
            html += '<thead>';
            html += '<tr class="dp-table-title"><th colspan="4">Stack-up, materials, thickness and colours</th></tr>';
            html += '<tr><th>Layer</th><th>File</th><th>Material / finish</th><th>Thickness</th></tr>';
            html += '</thead><tbody>';
            for (const r of rows) {
                const chipClass = ['dp-chip', r.swatch ? '' : 'dp-chip--plain',
                                   r.light ? 'dp-chip--light' : '', r.thick ? 'dp-chip--thick' : '']
                                  .filter(Boolean).join(' ');
                const chipStyle = r.swatch ? ' style="--dp-swatch:' + r.swatch + '"' : '';
                const thicknessClass = 'dp-stack-meta' + (r.estimated ? ' dp-stack-est' : '');
                const thicknessTitle = r.estimated ? ' title="Industry-typical value; the archive does not state it"' : '';
                html += '<tr>';
                html += '<td><span class="' + chipClass + '"' + chipStyle + '>' + esc(r.name) + '</span></td>';
                html += '<td class="dp-stack-meta dp-stack-file">' + esc(r.file) + '</td>';
                html += '<td class="dp-stack-meta">' + esc(r.material) + '</td>';
                html += '<td class="' + thicknessClass + '"' + thicknessTitle + '>'
                      + (r.estimated ? '≈ ' : '') + esc(r.thickness) + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table>';
            html += '<div class="dp-stack-total">';
            html += '<span>Stack sum (' + esc(formatLengthMm(copperMm)) + ' copper + '
                  + esc(formatLengthMm(dielectricMm)) + ' dielectric): '
                  + esc(formatLengthMm(copperMm + dielectricMm)) + '</span>';
            html += '<span>All layers incl. mask and legend: ' + esc(formatLengthMm(stackupTotalMm)) + '</span>';
            html += '</div>';
            if (anyEstimated) {
                html += '<div class="dp-stack-note">≈ industry-typical value — the archive does not state this thickness.</div>';
            }
            html += '</div>';
            dataPanel.innerHTML = html;
        }

        // ===== BOM + centroid combined view =====
        function bomRowSearchableText(r) {
            return [
                r.item, r.partNumber, r.packageName, r.manufacturer, r.mpn, r.ipn,
                r.description, r.quantity,
                ...(r.refdesList || []).map(p => p.refdes)
            ].filter(x => x != null).join(' ').toLowerCase();
        }

        function bomRowSortValue(r, key) {
            switch (key) {
                case 'item':       return r.item == null ? Infinity : r.item;
                case 'partNumber': return (r.partNumber || '').toLowerCase();
                case 'packageName':return (r.packageName || '').toLowerCase();
                case 'manufacturer':return (r.manufacturer || '').toLowerCase();
                case 'mpn':        return (r.mpn || '').toLowerCase();
                case 'quantity':   return r.quantity || 0;
                case 'refdes':     return (r.refdesList || []).map(p => p.refdes).sort().join(',');
                default:           return '';
            }
        }

        function setBomSort(key) {
            if (bomSortKey === key) bomSortDir = -bomSortDir;
            else { bomSortKey = key; bomSortDir = 1; }
            renderBom();
        }

        function exportBomCsv() {
            const header = ['Item','PartNumber','Package','Manufacturer','MPN','IPN','Quantity','RefDes','Description'];
            const escape = v => {
                v = (v == null ? '' : String(v));
                return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
            };
            const lines = [header.join(',')];
            for (const r of billData || []) {
                const refs = (r.refdesList || []).map(p => p.refdes).join(' ');
                lines.push([r.item ?? '', r.partNumber, r.packageName, r.manufacturer, r.mpn,
                            r.ipn, r.quantity, refs, r.description].map(escape).join(','));
            }
            const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (currentFile?.name || 'pcb').replace(/\.(zip|tgz|tar\.gz)$/i,'') + '-bom.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        function exportCentroidCsv() {
            const header = ['RefDes','PartNumber','Side','X_mm','Y_mm','Rotation_deg','Mirror'];
            const escape = v => {
                v = (v == null ? '' : String(v));
                return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
            };
            const lines = [header.join(',')];
            for (const r of billData || []) {
                for (const p of r.refdesList || []) {
                    lines.push([p.refdes, r.partNumber, p.side,
                                p.xMm?.toFixed(4), p.yMm?.toFixed(4),
                                p.rotation, p.mirror].map(escape).join(','));
                }
            }
            const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (currentFile?.name || 'pcb').replace(/\.(zip|tgz|tar\.gz)$/i,'') + '-centroid.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        function renderBom() {
            svgContainer.classList.add('hidden');
            dataPanel.classList.remove('hidden');
            if (!billData || billData.length === 0) {
                dataPanel.innerHTML = '<div style="color:var(--fg-faint);text-align:center;padding:40px;">No BOM data in this archive.</div>';
                return;
            }

            const filterText = (bomFilter || '').toLowerCase().trim();
            let rows = billData;
            if (filterText) rows = rows.filter(r => bomRowSearchableText(r).includes(filterText));
            rows = rows.slice().sort((a, b) => {
                const av = bomRowSortValue(a, bomSortKey);
                const bv = bomRowSortValue(b, bomSortKey);
                if (av < bv) return -1 * bomSortDir;
                if (av > bv) return  1 * bomSortDir;
                return 0;
            });

            const totalRefdes = (billData || []).reduce((s, r) => s + (r.refdesList?.length || 0), 0);
            const escape = s => (s == null ? '' : String(s))
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            const sortIndicator = key =>
                bomSortKey === key ? (bomSortDir > 0 ? ' ▲' : ' ▼') : '';

            let html = '<div class="bom-view">';
            html += '<div class="bom-toolbar">';
            html += `<span class="bom-summary">${rows.length} of ${billData.length} parts · ${totalRefdes} placed components</span>`;
            html += `<input class="bom-search" type="search" placeholder="Filter parts, refdes, descriptions…" value="${escape(bomFilter)}" oninput="bomFilter=this.value;renderBom();this.focus()">`;
            html += `<button class="bom-export" onclick="exportBomCsv()">Export BOM CSV</button>`;
            html += `<button class="bom-export" onclick="exportCentroidCsv()">Export Centroid CSV</button>`;
            html += '</div>';

            html += '<div class="bom-table-wrap"><table class="bom-table">';
            html += '<thead><tr>';
            const cols = [
                ['item', '#'],
                ['partNumber', 'Part Number'],
                ['packageName', 'Package'],
                ['manufacturer', 'Manufacturer'],
                ['mpn', 'MPN'],
                ['quantity', 'Qty'],
                ['refdes', 'RefDes (hover for centroid)'],
            ];
            for (const [key, label] of cols) {
                html += `<th onclick="setBomSort('${key}')">${escape(label)}${sortIndicator(key)}</th>`;
            }
            html += '<th>Description</th>';
            html += '</tr></thead><tbody>';

            for (const r of rows) {
                html += '<tr' + (r.orphan ? ' class="orphan"' : '') + '>';
                html += `<td class="num">${r.item != null ? r.item : '—'}</td>`;
                html += `<td>${escape(r.partNumber)}</td>`;
                html += `<td>${escape(r.packageName)}</td>`;
                html += `<td>${escape(r.manufacturer)}</td>`;
                html += `<td>${escape(r.mpn)}</td>`;
                html += `<td class="num">${r.quantity || (r.refdesList?.length ?? 0)}</td>`;
                html += '<td class="refdes-cell">';
                for (const p of r.refdesList || []) {
                    const cls = 'refdes-pill side-' + (p.side || 'NEITHER').toLowerCase();
                    html += `<span class="${cls}" data-refdes="${escape(p.refdes)}">${escape(p.refdes)}</span>`;
                }
                html += '</td>';
                html += `<td class="description" title="${escape(r.description)}">${escape(r.description)}</td>`;
                html += '</tr>';
            }
            html += '</tbody></table></div></div>';
            dataPanel.innerHTML = html;
            hoveredPill = null;
            hideHoverCard();
        }

        // ===== Layer list =====
        let visibilityBeforeHover = null;

        function renderLayerList() {
            if (layers.length === 0) {
                layerList.innerHTML = '<div class="no-layers">No layers loaded</div>';
                return;
            }
            layerList.innerHTML = layers.map((layer, index) => {
                const label = LAYER_TYPE_LABELS[layer.type] || layer.type;
                const ctx = layer.context ? ` ${layer.context.charAt(0)}${layer.context.slice(1).toLowerCase()}` : '';
                return `<div class="layer-item" data-index="${index}"
                        onmouseenter="hoverLayerStart(${index})"
                        onmouseleave="hoverLayerEnd()">
                    <input type="checkbox" ${layer.visible ? 'checked' : ''}
                        onclick="event.stopPropagation(); toggleLayer(${index})">
                    <div class="color-dot" style="background: ${layer.color}"></div>
                    <span class="name" title="${layer.name}" onclick="toggleLayer(${index})" style="cursor:pointer">${layer.name}</span>
                    <span class="layer-type-badge">${label}${ctx}</span>
                </div>`;
            }).join('');
            updateSelectAllCheckbox();
        }

        function updateSelectAllCheckbox() {
            const cb = document.getElementById('select-all-layers');
            if (!cb || layers.length === 0) return;
            const visCount = layers.filter(l => l.visible).length;
            cb.checked = visCount === layers.length;
            cb.indeterminate = visCount > 0 && visCount < layers.length;
        }

        function toggleAllLayers() {
            const cb = document.getElementById('select-all-layers');
            const newState = cb.checked;
            layers.forEach(l => l.visible = newState);
            applyLayerVisibility();
            renderLayerList();
        }

        function selectSide(side) {
            layers.forEach(l => {
                const isDrill = l.type === 'DRILL' || l.type === 'ROUT';
                const isProfile = l.type === 'PROFILE';
                const matchesSide = l.context === side;
                l.visible = isDrill || isProfile || matchesSide;
            });
            applyLayerVisibility();
            renderLayerList();
        }

        function toggleLayer(index) {
            layers[index].visible = !layers[index].visible;
            applyLayerVisibility();
            renderLayerList();
        }

        function applyLayerVisibility() {
            if (currentView !== 'layers') return;
            for (const layer of layers) {
                const el = svgContent.querySelector(`#${CSS.escape(layer.id)}`);
                if (el) el.setAttribute('display', layer.visible ? 'inline' : 'none');
            }
        }

        function hoverLayerStart(index) {
            if (currentView !== 'layers') return;
            visibilityBeforeHover = layers.map(l => l.visible);
            for (let i = 0; i < layers.length; i++) {
                const el = svgContent.querySelector(`#${CSS.escape(layers[i].id)}`);
                if (el) el.setAttribute('display', i === index ? 'inline' : 'none');
            }
        }

        function hoverLayerEnd() {
            if (currentView !== 'layers' || !visibilityBeforeHover) return;
            for (let i = 0; i < layers.length; i++) {
                const el = svgContent.querySelector(`#${CSS.escape(layers[i].id)}`);
                if (el) el.setAttribute('display', visibilityBeforeHover[i] ? 'inline' : 'none');
            }
            visibilityBeforeHover = null;
        }

        // ===== Pan & Zoom =====
        svgContainer.addEventListener('mousedown', (e) => {
            if (e.button === 0) { isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; }
        });
        document.addEventListener('mousemove', (e) => {
            if (isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); }
        });
        document.addEventListener('mouseup', () => { isPanning = false; });

        svgContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = svgContainer.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const ns = Math.max(0.1, Math.min(50, scale * delta));
            panX = mx - (mx - panX) * (ns / scale);
            panY = my - (my - panY) * (ns / scale);
            scale = ns;
            updateTransform();
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            const r = svgContainer.getBoundingClientRect();
            const cx = r.width/2, cy = r.height/2;
            const ns = Math.min(50, scale * 1.25);
            panX = cx - (cx - panX) * (ns / scale); panY = cy - (cy - panY) * (ns / scale);
            scale = ns; updateTransform();
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            const r = svgContainer.getBoundingClientRect();
            const cx = r.width/2, cy = r.height/2;
            const ns = Math.max(0.1, scale * 0.8);
            panX = cx - (cx - panX) * (ns / scale); panY = cy - (cy - panY) * (ns / scale);
            scale = ns; updateTransform();
        });
        document.getElementById('zoom-fit').addEventListener('click', fitToView);

        function fitToView() {
            const svg = svgContent.querySelector('svg');
            if (!svg) return;
            const rect = svgContainer.getBoundingClientRect();
            const vb = svg.getAttribute('viewBox');
            if (!vb) return;
            const [,,w,h] = vb.split(' ').map(Number);
            const sw = w * PX_PER_MM, sh = h * PX_PER_MM;
            const pad = 40;
            scale = Math.min((rect.width - pad*2) / sw, (rect.height - pad*2) / sh, 10);
            panX = (rect.width - sw * scale) / 2;
            panY = (rect.height - sh * scale) / 2;
            updateTransform();
        }

        function updateTransform() {
            svgContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomLevel.textContent = Math.round(scale * 100) + '%';
            updateGrid();
        }

        /**
         * Keep the backdrop grid on the board's own scale: one square is 10 mm of PCB, wherever
         * the view is panned or zoomed to. The rendered SVG is sized in millimetres, so a
         * millimetre is PX_PER_MM CSS pixels before the pan/zoom transform and PX_PER_MM * scale
         * after it; the pan offset is in the same coordinates the grid's background-position uses,
         * both measured from the viewer's top-left, so the grid tracks the artwork exactly.
         *
         * The lines are painted by the container rather than inside the transformed element on
         * purpose — scaled with the content they would thicken and blur as you zoom in.
         */
        function updateGrid() {
            const cell = GRID_MM * PX_PER_MM * scale;
            viewerContainer.style.backgroundSize = `${cell}px ${cell}px`;
            viewerContainer.style.backgroundPosition = `${panX}px ${panY}px`;
        }

        // ===== Version badge =====
        // The server fills the badge from version.properties as it renders the page; a build
        // without a filtered version leaves it empty, and then there is nothing honest to show.
        (function showVersion() {
            const el = document.getElementById('app-version');
            if (!el) return;
            const v = el.textContent.trim();
            if (!v || v.startsWith('$')) el.style.display = 'none';
            else el.textContent = v.startsWith('v') ? v : 'v' + v;
        })();

        // ===== Sidebar resize =====
        (function initSidebarResize() {
            const sidebar = document.querySelector('.sidebar');
            const resizer = document.getElementById('sidebar-resizer');
            const MIN = 180, MAX = 600;
            const stored = parseInt(localStorage.getItem('odbpp-viewer-sidebar-width'), 10);
            if (!isNaN(stored) && stored >= MIN && stored <= MAX) {
                sidebar.style.width = stored + 'px';
            }
            let dragging = false;
            resizer.addEventListener('mousedown', (e) => {
                dragging = true;
                resizer.classList.add('dragging');
                document.body.classList.add('resizing-sidebar');
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const rect = sidebar.getBoundingClientRect();
                let w = e.clientX - rect.left;
                if (w < MIN) w = MIN;
                if (w > MAX) w = MAX;
                sidebar.style.width = w + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                resizer.classList.remove('dragging');
                document.body.classList.remove('resizing-sidebar');
                localStorage.setItem('odbpp-viewer-sidebar-width', parseInt(sidebar.style.width, 10));
            });
        })();

        // ===== UI helpers =====
        function showFileInfo(filename, stepCount) {
            const container = document.getElementById('file-info-container');
            container.innerHTML = `<div class="file-info">Loaded: ${filename} (${stepCount} step${stepCount !== 1 ? 's' : ''})</div>`;
        }

        // ===== Theme toggle =====
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            document.body.classList.toggle('light', !isDark);
            localStorage.setItem('odbpp-viewer-theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.body.classList.contains('dark');
            const rays = document.getElementById('theme-icon-rays');
            if (rays) rays.style.display = isDark ? '' : 'none';
        }

        function applyStoredTheme() {
            const stored = localStorage.getItem('odbpp-viewer-theme');
            let isDark;
            if (stored) {
                isDark = stored === 'dark';
            } else {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            document.body.classList.toggle('dark', isDark);
            document.body.classList.toggle('light', !isDark);
            updateThemeIcon();
        }
        applyStoredTheme();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (!localStorage.getItem('odbpp-viewer-theme')) applyStoredTheme();
        });

        // ===== Init =====
        updateTransform();
        (async () => {
            await initDb();
            renderRecentProjects();
        })();
    </script>
</body>
</html>
